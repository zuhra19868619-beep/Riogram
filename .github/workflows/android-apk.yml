name: Android APK build
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
concurrency:
  group: riogram-android
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android and iOS scaffolding
        working-directory: mobile
        run: flutter create --platforms=android,ios --project-name riogram .
      - name: Match Firebase Android application ID
        working-directory: mobile
        run: |
          sed -i 's/applicationId = "com.example.riogram"/applicationId = "com.riogram.app"/' android/app/build.gradle.kts
          grep -F 'applicationId = "com.riogram.app"' android/app/build.gradle.kts
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Print APK signing certificate SHA-1 and SHA-256
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          echo "### Riogram debug APK signing certificate" >> "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile "$APK" | tee /tmp/riogram-cert.txt
          grep -E 'SHA1:|SHA256:' /tmp/riogram-cert.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "These fingerprints apply only to this debug APK signing certificate." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare named APK
        run: cp mobile/build/app/outputs/flutter-apk/app-debug.apk riogram-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riogram-debug-apk
          path: riogram-debug.apk
          if-no-files-found: error
      - name: Publish latest test APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest riogram-debug.apk --clobber
          else
            gh release create dev-latest riogram-debug.apk --target "${GITHUB_SHA}" --title "Riogram Android test APK" --notes "Automated debug APK for testing only. Not production-ready." --prerelease
          fi
